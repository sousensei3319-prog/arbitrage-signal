name: JP Stock History (daily/weekly/monthly/1m backfill/rotate)

# 週足・月足および長期日足チャート/集計窓のためのデータ収集。
# jp_stock_fetch.py を INTERVAL/RANGE を変えて4回呼び、
#   {code}_1d.csv (日足2年) / {code}_1wk.csv (週足5年) / {code}_1mo.csv (月足max)
#   / {code}_1m.csv (1分足RANGE=5dで追取り — 30分cadence(jp-stock.yml)がRANGE=1dに
#     軽量化された分、日をまたいだ欠損をここで回収する)
# を data/jp_stocks/ に差分蓄積したあと、jp_stock_rotate.py で1分足ライブファイルを
# 直近ROLLING_DAYS営業日に切り詰め、溢れた分を月次gzipアーカイブへ退避する
# (850銘柄化のリポジトリ肥大化対策)。日/週/月足・1分足backfillは場中に動かないため
# 1日1回(引け後)で十分。

on:
  schedule:
    # 東証引け(15:30 JST=06:30 UTC)の後。:00/:30 を避け 07:33 UTC (16:33 JST)。平日。
    - cron: '33 7 * * 1-5'
  workflow_dispatch:
  # フィーチャーブランチ検証用 (本体/workflow変更時に1回走る)
  push:
    paths:
      - 'jp_stock_fetch.py'
      - 'jp_stock_rotate.py'
      - 'ledger.py'
      - '.github/scripts/freshness_check.py'
      - '.github/workflows/jp-stock-history.yml'

permissions:
  contents: write

concurrency:
  group: jp-stock-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    # 各取得stepの締切(10+10+10+16分)+台帳+保存が収まる長さ (620〜810銘柄化で重くなったため35→60)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 依存なし (標準ライブラリのみ)。取得対象は data/jp_stocks/universe.csv
      - name: Fetch daily bars (2y)
        env: { INTERVAL: '1d',  RANGE: '2y',  SLEEP_SEC: '0.4', FETCH_DEADLINE_MIN: '10' }
        run: python jp_stock_fetch.py
      - name: Fetch weekly bars (5y)
        env: { INTERVAL: '1wk', RANGE: '5y',  SLEEP_SEC: '0.4', FETCH_DEADLINE_MIN: '10' }
        run: python jp_stock_fetch.py
      - name: Fetch monthly bars (max)
        env: { INTERVAL: '1mo', RANGE: 'max', SLEEP_SEC: '0.4', FETCH_DEADLINE_MIN: '10' }
        run: python jp_stock_fetch.py
      # 30分cadence(jp-stock.yml)はRANGE=1dに軽量化したため、日をまたいだ欠損
      # (実行ドロップ・ジョブ失敗等)をここでRANGE=5dの取り直しにより回収する。
      - name: Fetch 1m bars (5d backfill)
        env: { INTERVAL: '1m',  RANGE: '5d',  SLEEP_SEC: '0.4', FETCH_DEADLINE_MIN: '16' }
        run: python jp_stock_fetch.py

      # 1分足ライブファイルを直近ROLLING_DAYS営業日に切り詰め、溢れた分を
      # 月次gzipアーカイブ({code}_T_1m_YYYYMM.csv.gz)へ退避 (リポジトリ肥大化対策)
      - name: Rotate 1m live files to monthly archive
        env: { ROLLING_DAYS: '7' }
        run: python jp_stock_rotate.py

      # 仮想台帳の答え合わせ待ちなのにユニバースから外れた銘柄 (話題枠の除外など) の日足だけ取り続ける。
      # 取らないと、外れた銘柄の +20日 が永久に空欄のまま集計から消える (生き残った銘柄だけが残る偏り)
      - name: Keep daily bars for ledger rows outside the universe
        env: { INTERVAL: '1d', RANGE: '3mo', SLEEP_SEC: '0.4', FETCH_DEADLINE_MIN: '3' }
        run: |
          P=$(python ledger.py jp --pending-codes 2>/dev/null || true)
          if [ -n "$P" ]; then
            echo "ユニバース外の答え合わせ待ち: $P"
            JP_TICKERS="$P" python jp_stock_fetch.py || true
          else
            echo "対象なし"
          fi

      # 仮想の約定記録 (ledger.py): その日のユニバース全銘柄の判定(日次の資金集中度・候補フラグ・
      # 引け時点のスクリーナー値)を記録し、過去の記録に答え合わせ(+1/+5/+20営業日)を書き足す。
      # 失敗しても収集データの保存は止めない (continue-on-error) が、最後に赤にして知らせる
      - name: Virtual ledger (判定の記録 + 答え合わせ)
        id: ledger
        continue-on-error: true
        run: python ledger.py jp

      - name: Persist collected data
        run: |
          git config user.name "jp-stock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- data/jp_stocks 2>/dev/null || true
          # 仮想台帳は次の step で別に (再試行付きで) 保存する
          git reset -q -- data/jp_stocks/ledger 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: JP stock history (d/w/m/1m backfill/rotate) $(date -u +'%Y-%m-%d %H:%M')"
          # rebase競合時はabortして「push failed (race)」を正しく踏ませる
          # (競合したまま放置するとpushが「Everything up-to-date」となり
          #  データ喪失がsuccessに見える。2026-07-09に並走runで実際に発生)
          # 収集データは次回の取得で自然回復するので、ここは従来どおり1回だけ試す
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || { git rebase --abort 2>/dev/null || true; }
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push failed (race) - next run"
          else
            echo "新規バーなし"
          fi

      # 仮想台帳は「次回で自然回復」しない (取りこぼした日は補完扱いで集計から外れる) ため、
      # 最新のブランチに自分のファイルだけを載せ直し、再試行付きで保存する。失敗は赤
      # (2026-10-03 のブランチ検証で、収集データの衝突に巻き込まれて台帳が保存されなかったため分離)
      - name: Persist virtual ledger
        if: steps.ledger.outcome == 'success'
        env: { COMMIT_BOT_NAME: 'jp-stock-bot' }
        run: |
          git fetch -q origin "${GITHUB_REF_NAME}" && git reset -q FETCH_HEAD
          bash .github/scripts/commit_back.sh "chore: 仮想台帳 JP $(date -u +'%Y-%m-%d %H:%M')" data/jp_stocks/ledger

      - name: Ledger failure is red
        if: steps.ledger.outcome == 'failure'
        run: |
          echo "::error::仮想台帳 (ledger.py) が失敗しました。収集データは保存済み。3営業日以内に直れば翌回に補完されます (補完分は集計から除外)"
          exit 1

      # 週次の話題枠入れ替え・台帳が止まっていないかの点検 (main の予定実行と cron-job.org/手動の起動の時。
      # push 起動はマージ直後の並走で誤報しうるので点検しない)
      - name: Freshness check
        if: ${{ always() && github.event_name != 'push' && github.ref == 'refs/heads/main' }}
        run: python .github/scripts/freshness_check.py jp

      - name: Notify failure (Discord)
        if: failure() && github.ref == 'refs/heads/main'
        env:
          WEBHOOK_URL: ${{ secrets.SMART_MONEY_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
          NOTIFY_WHAT: 日本株の履歴収集・仮想台帳・鮮度点検のいずれか
        run: python .github/scripts/notify_failure.py
