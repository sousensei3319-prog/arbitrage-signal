name: JP Hot Bucket Refresh (話題枠の週次自動入れ替え)

# 話題枠(hot bucket)を毎週月曜の寄り前に自動入れ替え (hot_refresh.py)。
# Yahoo Finance Japan の出来高・値上がり率ランキング上位から、ユニバース外の話題株を
# hot に追加し、話題でなくなった古い hot 銘柄を外す。TOPIX500/日経225 は絶対に外さない。
# 注意:
#   - schedule はデフォルトブランチ(main)にマージ後のみ有効 (GitHub仕様)
#   - フィーチャーブランチ検証は push トリガーで代用 (実データ検証はランナー上が初)
#   - サンドボックスからは Yahoo JP へ proxy403 で到達不可のため、本体の疎通確認は
#     このランナー上の実行が唯一の手段
#   - 週次のため schedule 遅延(数時間)は許容範囲。ただし遅延で場中にずれ込むと5分ごとの
#     収集ジョブとコミットが衝突しやすい (2026-09-28 は money_flow の衝突で入れ替え結果が
#     丸ごと消え、runは緑のままだった)。対策: 本ジョブが所有するファイルだけをコミットし
#     (money_flowは収集ジョブの持ち物なのでコミットしない)、push競合は再試行、失敗は赤で通知
#   - universe-refresh.yml と同じ concurrency group で直列化 (どちらも universe.csv を書くため)

on:
  schedule:
    # 月曜 07:11 JST = 日曜 22:11 UTC (寄り前)。:00/:15/:30 を避けオフセット。
    - cron: '11 22 * * 0'
  workflow_dispatch:
  push:
    paths:
      - 'hot_refresh.py'
      - '.github/workflows/hot-refresh.yml'

permissions:
  contents: write

# universe.csv を書く週次話題枠(本workflow)と月次更新(universe-refresh.yml)を同じgroupで直列化
concurrency:
  group: jp-universe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 直前に走った別ジョブ(月次ユニバース更新⇔週次話題枠)のpushを取り込んでから計算する。
      # checkoutはトリガー時点のコミットなので、待機中に他ジョブが更新したuniverse.csvを
      # 古いまま上書きしないよう最新へ揃える (同じconcurrency groupで直列化済み)。
      - name: Sync to latest branch head
        run: |
          git fetch -q origin "${GITHUB_REF_NAME}"
          git reset -q --hard FETCH_HEAD
          git log -1 --format='最新コミットへ同期: %h %s'

      # 依存なし (標準ライブラリのみ)
      - name: Refresh hot bucket from trending rankings
        env:
          RANK_TOP: '30'
          ABSENT_WEEKS: '4'
          KEEP_SURGE: '1.3'
          FETCH_DEADLINE_MIN: '5'
          HOT_ADDED_OUT: ${{ runner.temp }}/hot_added.txt
        run: python hot_refresh.py

      # 新規追加した話題株の履歴(日足2y/週足5y/月足max/1分足5d)を即取得する。
      # これをしないと「今週の話題枠 入れ替え」欄には出るのに、収集が回るまで
      # 資金集中ランキング/全銘柄表/チャートに出ないタイムラグが生じる (2026-07-13対応)。
      - name: Fetch initial history for newly added stocks
        env:
          SLEEP_SEC: '0.4'
          FETCH_DEADLINE_MIN: '8'
        run: |
          # 今回の実行で追加した銘柄だけ (同じ週の再実行で取り直さない)
          NEW=$(cat "$RUNNER_TEMP/hot_added.txt" 2>/dev/null || true)
          if [ -z "$NEW" ]; then echo "新規追加なし・初期取得スキップ"; exit 0; fi
          echo "新規話題株の初期履歴を取得: $NEW"
          JP_TICKERS="$NEW" INTERVAL=1d  RANGE=2y  python jp_stock_fetch.py || true
          JP_TICKERS="$NEW" INTERVAL=1wk RANGE=5y  python jp_stock_fetch.py || true
          JP_TICKERS="$NEW" INTERVAL=1mo RANGE=max python jp_stock_fetch.py || true
          JP_TICKERS="$NEW" INTERVAL=1m  RANGE=5d  python jp_stock_fetch.py || true

      # (旧 "Screen money flow" ステップは削除: money_flow は5分ごとの収集ジョブが更新し、
      #  Pages公開時にも pages.yml が再計算するため、ここでコミットする必要が無い。
      #  ここでコミットすると収集ジョブと衝突して入れ替え結果ごと消える原因になっていた)

      # 本ジョブの持ち物だけを1ファイルずつコミットバック:
      # universe.csv・状態/ログ/最新サマリー・新規銘柄の履歴CSV
      - name: Persist hot bucket changes
        run: |
          FILES="data/jp_stocks/universe.csv data/jp_stocks/hot_state.json data/jp_stocks/hot_changes_log.csv data/jp_stocks/hot_changes_latest.json"
          NEW=$( [ -f "$RUNNER_TEMP/hot_added.txt" ] && tr ',' ' ' < "$RUNNER_TEMP/hot_added.txt" || true)
          for c in $NEW; do
            for iv in 1d 1wk 1mo 1m; do FILES="$FILES data/jp_stocks/${c}_T_${iv}.csv"; done
          done
          bash .github/scripts/commit_back.sh "chore: 話題枠 週次入れ替え+新規銘柄の初期履歴 $(date -u +'%Y-%m-%d')" $FILES
