name: US Universe Refresh (S&P500+Nasdaq-100+話題枠)

# 監視ユニバース(data/us_stocks/universe.csv)を月1回、S&P500(Wikipedia)+Nasdaq-100
# (Wikipedia)+話題枠(既存hotシード)から機械的に再構築する (us_universe_refresh.py)。
# 手打ちでの銘柄追加/削除は行わない設計。custom_groups.csv(半導体)もあわせて機械生成。
# jp版(universe-refresh.yml)の構造を踏襲。xlrd等の追加依存は不要 (Wikipediaを
# html.parserのみで解析するため pip install ステートなし)。
# 注意:
#   - schedule はデフォルトブランチ(main)にマージ後のみ有効 (GitHub仕様)
#   - フィーチャーブランチでの検証は push トリガーで代用
#   - このサンドボックス(Claude Code)からはWikipediaにproxy403で到達不可のため、
#     実データ疎通の検証はこのランナー上の実行が初 (JP版と同じ制約)
#   - 【安全装置】ソース件数の不足・大量除外を検知したら universe.csv/custom_groups.csv を
#     書き換えず exit 2 (赤) で止まる。本当に大量入替の月は workflow_dispatch の max_drop で再実行
#   - us-hot-refresh.yml と同じ concurrency group で直列化 (どちらも universe.csv を書くため)

on:
  schedule:
    # 月初想定。S&P500/Nasdaq-100の構成銘柄入替は不定期だが月1回の再構築で十分。
    # :00/:15/:30 はGitHub負荷ピークでドロップされやすいため :41 にオフセット。
    - cron: '41 20 4 * *'
  workflow_dispatch:
    inputs:
      max_drop:
        description: '既存leader/coreから一度に外してよい最大件数 (空=既定100。大量入替の月だけ引き上げる)'
        required: false
        default: ''
  # フィーチャーブランチ上での動作検証用 (本体/workflow変更時に1回走る)
  push:
    paths:
      - 'us_universe_refresh.py'
      - '.github/workflows/us-universe-refresh.yml'

permissions:
  contents: write

# universe.csv を書く月次更新(本workflow)と週次話題枠(us-hot-refresh.yml)を同じgroupで直列化
concurrency:
  group: us-universe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 直前に走った別ジョブ(米国 月次ユニバース更新⇔週次話題枠)のpushを取り込んでから計算する。
      # checkoutはトリガー時点のコミットなので、待機中に他ジョブが更新したuniverse.csvを
      # 古いまま上書きしないよう最新へ揃える (同じconcurrency groupで直列化済み)。
      - name: Sync to latest branch head
        run: |
          git fetch -q origin "${GITHUB_REF_NAME}"
          git reset -q --hard FETCH_HEAD
          git log -1 --format='最新コミットへ同期: %h %s'

      # 依存なし (標準ライブラリのみ、html.parserでWikipediaテーブルを解析) — pip installは不要
      - name: Refresh universe (S&P500 + Nasdaq-100 + hot)
        env:
          FETCH_DEADLINE_MIN: '5'
          MAX_DROP: ${{ inputs.max_drop }}
        run: python us_universe_refresh.py

      # 再構築したCSV(universe.csv + custom_groups.csv + index_members.csv)をコミットバック
      # (1ファイルずつadd・push競合は再試行・失敗は赤で通知)
      - name: Persist universe.csv / custom_groups.csv / index_members.csv
        env:
          COMMIT_BOT_NAME: us-stock-bot
        run: |
          bash .github/scripts/commit_back.sh \
            "chore: 米国株 監視ユニバース再構築 (S&P500+Nasdaq-100+話題枠) $(date -u +'%Y-%m-%d %H:%M')" \
            data/us_stocks/universe.csv data/us_stocks/custom_groups.csv data/us_stocks/index_members.csv
