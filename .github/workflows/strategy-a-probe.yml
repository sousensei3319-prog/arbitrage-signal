name: Strategy A FGI check (調査用・一時)

# 戦略Aの「FGI恐怖で+1点」を過去データで答え合わせする一時的な調査 (.github/scripts/strategy_a_probe.py)。
# 発注しない・APIキー不要・保存も通知もしない (ログに要約を出すだけ)。調べ終わったら main に入れずに消す。
on:
  push:
    branches: [ccr-44e74cc7-y92cr6]
    paths:
      - '.github/scripts/strategy_a_probe.py'
      - '.github/workflows/strategy-a-probe.yml'

permissions:
  contents: read

concurrency:
  group: strategy-a-probe
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Strategy A FGI+1 check (OKX daily + Hyperliquid funding + OKX L/S + FGI)
        run: python .github/scripts/strategy_a_probe.py
