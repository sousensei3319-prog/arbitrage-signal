name: TMP Yahoo 1m probe

# 一時的な調査用 (PR を出す前に削除する)。1分足が取れない銘柄を Yahoo・JPX・Wikipedia で調べ、
# 鮮度点検 (freshness_check.py) をこのブランチの版で main の最新のデータに対してランナー上で試す。
# 何もコミットしない。フィーチャーブランチ上は workflow_dispatch が使えないので push で起動する。

on:
  push:
    paths:
      - '.github/scripts/tmp_yahoo_probe.py'
      - '.github/workflows/tmp-yahoo-probe.yml'

permissions:
  contents: read

concurrency:
  group: tmp-yahoo-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts
            universe_refresh.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install xlrd (JPX の旧xls形式に備える)
        run: pip install -q xlrd || true
      - name: Probe JPX / Yahoo / Wikipedia
        run: python .github/scripts/tmp_yahoo_probe.py

  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # データは main の最新、点検のスクリプトだけこのブランチの版にする
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Overlay freshness_check.py from this branch
        run: |
          git fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout FETCH_HEAD -- .github/scripts/freshness_check.py
          git log -1 --format='main: %h %s'
          echo "点検のスクリプト: ${GITHUB_SHA::8} の版"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Freshness check (jp / us) — 結果と通知文を表示するだけ
        run: |
          for m in jp us; do
            : > "${RUNNER_TEMP}/failure_notes.txt"
            echo "===== freshness_check.py ${m} ====="
            python .github/scripts/freshness_check.py "${m}" && echo "→ exit 0 (緑)" || echo "→ exit $? (赤)"
            echo "----- failure_notes.txt (Discord の失敗通知に載る文) -----"
            cat "${RUNNER_TEMP}/failure_notes.txt"
          done
