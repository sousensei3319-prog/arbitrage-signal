name: JP Stock Universe Refresh (TOPIX500+日経225+話題枠)

# 監視ユニバース(data/jp_stocks/universe.csv)を月1回、TOPIX500(JPX東証上場銘柄一覧の
# 規模区分)+日経225(日経公式ウエイトCSV)+話題枠(既存hot手動シード)から機械的に
# 再構築する (universe_refresh.py)。手打ちでの銘柄追加/削除は行わない設計。
# 注意:
#   - schedule はデフォルトブランチ(main)にマージ後のみ有効 (GitHub仕様)
#   - フィーチャーブランチでの検証は push トリガーで代用 (本体/workflow変更時に1回走る)
#   - このサンドボックス(Claude Code)からはJPX/Nikkei公式サイトにproxy403で到達不可の
#     ため、実データ疎通の検証はこのランナー上の実行が初 (jp-stock.ymlと同じ制約)
#   - JPX東証上場銘柄一覧(data_j)は2026-09に旧xls(BIFF)→xlsxへ形式変更された。
#     xlsxは標準ライブラリで、旧xlsはxlrdで読む (形式は先頭バイトで自動判定)
#   - 【安全装置】ソース件数の不足・大量除外を検知したら universe.csv を書き換えず
#     exit 2 (赤) で止まる。定期見直しで本当に大量入替の月は workflow_dispatch の
#     max_drop 入力 (例 300) で上限を一時的に引き上げて再実行する
#   - hot-refresh.yml と同じ concurrency group で直列化 (どちらも universe.csv を書くため)

on:
  schedule:
    # 月初の平日想定。TOPIX/日経225の構成銘柄入替は月末公表が多いため月初に反映。
    # :00/:15/:30 はGitHub負荷ピークでドロップされやすいため :41 にオフセット。
    - cron: '41 21 3 * *'
  workflow_dispatch:
    inputs:
      max_drop:
        description: '既存leader/coreから一度に外してよい最大件数 (空=既定100。定期見直しで大量入替の月だけ引き上げる)'
        required: false
        default: ''
  # フィーチャーブランチ上での動作検証用 (本体/workflow変更時に1回走る)
  push:
    paths:
      - 'universe_refresh.py'
      - '.github/workflows/universe-refresh.yml'

permissions:
  contents: write

# universe.csv を書く月次更新(本workflow)と週次話題枠(hot-refresh.yml)を同じgroupで直列化
concurrency:
  group: jp-universe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 旧xls(BIFF)形式に戻った場合の解析用 (xlsxは標準ライブラリで読むので不要)
      - name: Install xlrd (旧xls形式の解析用)
        run: pip install xlrd

      # 直前に走った別ジョブ(月次ユニバース更新⇔週次話題枠)のpushを取り込んでから計算する。
      # checkoutはトリガー時点のコミットなので、待機中に他ジョブが更新したuniverse.csvを
      # 古いまま上書きしないよう最新へ揃える (同じconcurrency groupで直列化済み)。
      - name: Sync to latest branch head
        run: |
          git fetch -q origin "${GITHUB_REF_NAME}"
          git reset -q --hard FETCH_HEAD
          git log -1 --format='最新コミットへ同期: %h %s'

      - name: Refresh universe (TOPIX500 + 日経225 + hot)
        env:
          FETCH_DEADLINE_MIN: '5'
          MAX_DROP: ${{ inputs.max_drop }}
        run: python universe_refresh.py

      # 再構築したCSVをコミットバック (1ファイルずつadd・push競合は再試行・失敗は赤で通知)
      - name: Persist universe.csv / index_members.csv
        run: |
          bash .github/scripts/commit_back.sh \
            "chore: 監視ユニバース再構築 (TOPIX500+日経225+話題枠) $(date -u +'%Y-%m-%d %H:%M')" \
            data/jp_stocks/universe.csv data/jp_stocks/index_members.csv
