name: US Stock History (daily/weekly/monthly/1m backfill/rotate)

# jp-stock-history.yml の構造をそのまま踏襲。週足・月足および長期日足チャート/集計窓の
# ためのデータ収集。us_stock_fetch.py を INTERVAL/RANGE を変えて4回呼び、
#   {code}_1d.csv (日足2年) / {code}_1wk.csv (週足5年) / {code}_1mo.csv (月足max)
#   / {code}_1m.csv (1分足RANGE=5dで追取り — 日中cadence(us-stock.yml)がRANGE=1dに
#     軽量化された分、日をまたいだ欠損をここで回収する)
# を data/us_stocks/ に差分蓄積したあと、us_stock_rotate.py で1分足ライブファイルを
# 直近ROLLING_DAYS営業日に切り詰め、溢れた分を月次gzipアーカイブへ退避する
# (リポジトリ肥大化対策)。日/週/月足・1分足backfillは場中に動かないため1日1回(引け後)で十分。

on:
  schedule:
    # NY市場引け(16:00 ET)の後。夏時間20:00 UTC・冬時間21:00 UTCのどちらでも引け後に
    # なるよう 21:23 UTC に設定 (:00/:30 を避けオフセット)。平日のみ。
    - cron: '23 21 * * 1-5'
  workflow_dispatch:
  # フィーチャーブランチ検証用 (本体/workflow変更時に1回走る)
  push:
    paths:
      - 'us_stock_fetch.py'
      - 'us_stock_rotate.py'
      - 'ledger.py'
      - '.github/scripts/freshness_check.py'
      - '.github/workflows/us-stock-history.yml'

permissions:
  contents: write
  actions: write   # 保存の後にダッシュボード (pages.yml) を起動する

concurrency:
  group: us-stock-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 遅れて来た予定実行は、その日の引け後処理が (日本株の収集の kick で) もう成功していれば何もしない。
  # 予定実行は毎日数時間遅れるので、放っておくと毎日2回動き、鮮度点検の赤も2回 @everyone で届く (2026-10-19 の運用の反証)。
  # 確かめられない時は動く (二重に動いても害は無い)
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'schedule'
        with:
          sparse-checkout: .github/scripts
      - id: g
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/kick_workflows.py --skip-if-done us-stock-history.yml >> "$GITHUB_OUTPUT"

  history:
    needs: guard
    if: ${{ !cancelled() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    # 各取得stepの締切(10+10+10+16分)+台帳+保存が収まる長さ (620〜810銘柄化で重くなったため35→60)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # cron-job.org の起動と GitHub の予定実行は同じ時刻に入る。予定実行の遅れが前の run の所要時間より
      # 短いと、待機していた方はトリガー時点の古いコミットから始まり、前の run が保存した仮想台帳を知らずに
      # 同じ判定日を記録し直して上書きする (記録時刻がずれ「最初の記録が正」が崩れる。2026-10-06 の点検)。
      # concurrency で直列化済みなので、開始時に最新へ揃えれば前の run の保存を必ず含む。
      - name: Sync to latest branch head
        run: |
          git fetch -q origin "${GITHUB_REF_NAME}"
          git reset -q --hard FETCH_HEAD
          git log -1 --format='最新コミットへ同期: %h %s'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 依存なし (標準ライブラリのみ)。取得対象は data/us_stocks/universe.csv
      - name: Fetch daily bars (2y)
        env: { INTERVAL: '1d',  RANGE: '2y',  SLEEP_SEC: '0.4', FETCH_DEADLINE_MIN: '10' }
        run: python us_stock_fetch.py
      - name: Fetch weekly bars (5y)
        env: { INTERVAL: '1wk', RANGE: '5y',  SLEEP_SEC: '0.4', FETCH_DEADLINE_MIN: '10' }
        run: python us_stock_fetch.py
      - name: Fetch monthly bars (max)
        env: { INTERVAL: '1mo', RANGE: 'max', SLEEP_SEC: '0.4', FETCH_DEADLINE_MIN: '10' }
        run: python us_stock_fetch.py
      # 日中cadence(us-stock.yml)はRANGE=1dに軽量化したため、日をまたいだ欠損
      # (実行ドロップ・ジョブ失敗等)をここでRANGE=5dの取り直しにより回収する。
      - name: Fetch 1m bars (5d backfill)
        env: { INTERVAL: '1m',  RANGE: '5d',  SLEEP_SEC: '0.4', FETCH_DEADLINE_MIN: '16' }
        run: python us_stock_fetch.py

      # 1分足ライブファイルを直近ROLLING_DAYS営業日に切り詰め、溢れた分を
      # 月次gzipアーカイブ({code}_1m_YYYYMM.csv.gz)へ退避 (リポジトリ肥大化対策)
      - name: Rotate 1m live files to monthly archive
        env: { ROLLING_DAYS: '7' }
        run: python us_stock_rotate.py

      # 仮想台帳の答え合わせ待ちなのにユニバースから外れた銘柄 (話題枠の除外など) の日足だけ取り続ける。
      # 取らないと、外れた銘柄の +20日 が永久に空欄のまま集計から消える (生き残った銘柄だけが残る偏り)
      - name: Keep daily bars for ledger rows outside the universe
        env: { INTERVAL: '1d', RANGE: '3mo', SLEEP_SEC: '0.4', FETCH_DEADLINE_MIN: '3' }
        run: |
          P=$(python ledger.py us --pending-codes 2>/dev/null || true)
          if [ -n "$P" ]; then
            echo "ユニバース外の答え合わせ待ち: $P"
            US_TICKERS="$P" python us_stock_fetch.py || true
          else
            echo "対象なし"
          fi

      # 仮想の約定記録 (ledger.py): その日のユニバース全銘柄の判定(日次の資金集中度・候補フラグ・
      # 引け時点のスクリーナー値)を記録し、過去の記録に答え合わせ(+1/+5/+20営業日)を書き足す。
      # 失敗しても収集データの保存は止めない (continue-on-error) が、最後に赤にして知らせる
      - name: Virtual ledger (判定の記録 + 答え合わせ)
        id: ledger
        continue-on-error: true
        run: python ledger.py us

      # 収集ジョブ (日本は cron-job.org から5分ごと・米国は遅れて動く予定実行) が同じ1分足ファイルを書くため、
      # 旧版は取り込み (rebase) が衝突すると「push failed (race)」で日足・週足・月足・1分足の追取りを全部捨てていた
      # (緑のまま。2026-10-07・10-08 の米国、10-08・10-09 の日本)。衝突した行だけ収集側 (後から取った値) を残して
      # 取り込み (-X ours: rebase では取り込み先 = 最新のブランチ側)、push の競合は5回まで取り込み直す。
      # 保存できなかった時は、台帳を保存した後に赤にする (下の「Data persist failure is red」)
      - name: Persist collected data
        id: persist
        continue-on-error: true
        run: |
          git config user.name "us-stock-bot"
          git config user.email "actions@users.noreply.github.com"
          # 仮想台帳は次の step で別に (再試行付きで) 保存する。下の取り込み (autostash) で台帳が衝突すると、作業ツリーの台帳に
          # 衝突の印が残り次の step がそれを保存してしまう (今は台帳を書くのが history だけなので起きないが、手で直した日に起きる。
          # 2026-10-19 の運用の反証)。この run が作った台帳を退避し、どの終わり方でも元に戻す
          keep="${RUNNER_TEMP}/ledger_keep"; rm -rf "$keep"; cp -a data/us_stocks/ledger "$keep" 2>/dev/null || true
          restore_ledger() { if [ -d "$keep" ]; then rm -rf data/us_stocks/ledger && cp -a "$keep" data/us_stocks/ledger; fi; }
          trap restore_ledger EXIT
          git add -- data/us_stocks 2>/dev/null || true
          git reset -q -- data/us_stocks/ledger 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "新規バーなし"; exit 0
          fi
          git commit -q -m "chore: US stock history (d/w/m/1m backfill/rotate) $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase --autostash -X ours origin "${GITHUB_REF_NAME}"; then
              if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "push成功 (${i}回目)"; exit 0
              fi
              echo "push失敗 (${i}回目): 他のジョブが先に保存した → 取り込み直して再試行"
            else
              git rebase --abort 2>/dev/null || true
              echo "取り込み失敗 (${i}回目): 衝突を自動で解決できなかった (ファイルの削除など)"
            fi
            sleep $((i * 4))
          done
          echo "::error::日足・週足・月足・1分足の追取りを5回試行しても保存できなかった"
          exit 1

      # 仮想台帳は「次回で自然回復」しない (取りこぼした日は補完扱いで集計から外れる) ため、
      # 最新のブランチに自分のファイルだけを載せ直し、再試行付きで保存する。失敗は赤
      # (2026-10-03 のブランチ検証で、収集データの衝突に巻き込まれて台帳が保存されなかったため分離)
      - name: Persist virtual ledger
        if: steps.ledger.outcome == 'success'
        env: { COMMIT_BOT_NAME: 'us-stock-bot' }
        run: |
          git fetch -q origin "${GITHUB_REF_NAME}" && git reset -q FETCH_HEAD
          bash .github/scripts/commit_back.sh "chore: 仮想台帳 US $(date -u +'%Y-%m-%d %H:%M')" data/us_stocks/ledger || {
            echo "・仮想台帳を保存できなかった (再試行しても失敗)。きょうの判定日は次の引け後処理で補完扱いになる (評価から外れる)。2日続いたら Claude に伝える" >> "${RUNNER_TEMP}/failure_notes.txt"
            exit 1; }

      # 確定した日足をダッシュボードに出す (pages.yml の予定実行は場中だけなので、引け後に届いた確定値は
      # 次の場が始まるまで画面に出なかった)。起動できなくても結果は変えない
      - name: Rebuild dashboard (Pages)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.persist.outcome == 'success' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/kick_workflows.py --dispatch pages.yml

      # 赤の理由と対処は RUNNER_TEMP/failure_notes.txt にも書き、Discord の失敗通知に載せる
      - name: 台帳の記録に失敗したら赤にする
        if: ${{ !cancelled() && steps.ledger.outcome == 'failure' }}
        run: |
          msg="仮想台帳 (ledger.py) の記録に失敗した (収集データの保存は別の step)。3営業日以内に直れば翌回に補完される (補完した日は評価から外れる)。2日続いたら Claude に伝える"
          echo "::error::${msg}"
          echo "・${msg}" >> "${RUNNER_TEMP}/failure_notes.txt"
          exit 1

      # 前の赤の step が exit 1 しても動くよう !cancelled() を付ける (付けないと暗黙の success() で飛ばされ、両方失敗した日に
      # 保存の失敗の理由が通知に載らない。2026-10-19 の運用の反証)
      - name: データの保存に失敗したら赤にする
        if: ${{ !cancelled() && steps.persist.outcome == 'failure' }}
        run: |
          msg="日足・週足・月足・1分足の追取りを保存できなかった (収集と5回ぶつかった。仮想台帳は別に保存済み)。1回なら対応不要 (翌日の引け後処理が5日分を取り直す)。2日続いたら Claude に伝える"
          echo "::error::${msg}"
          echo "・${msg}" >> "${RUNNER_TEMP}/failure_notes.txt"
          exit 1

      # 週次の話題枠入れ替え・台帳が止まっていないかの点検 (main の予定実行と cron-job.org/手動の起動の時。
      # push 起動はマージ直後の並走で誤報しうるので点検しない)
      - name: Freshness check
        if: ${{ always() && github.event_name != 'push' && github.ref == 'refs/heads/main' }}
        run: python .github/scripts/freshness_check.py us

      - name: Notify failure (Discord)
        if: failure() && github.ref == 'refs/heads/main'
        env:
          WEBHOOK_URL: ${{ secrets.SMART_MONEY_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
          NOTIFY_WHAT: 米国株の履歴収集・仮想台帳・鮮度点検のいずれか
        run: python .github/scripts/notify_failure.py
