name: US Hot Bucket Refresh (話題枠の週次自動入れ替え)

# 話題枠(hot bucket)を毎週月曜のNY寄り前に自動入れ替え (us_hot_refresh.py)。
# Yahoo Finance US の predefined screener API (most_actives/day_gainers) 上位から、
# ユニバース外の話題株を hot に追加し、話題でなくなった古い hot 銘柄を外す。
# S&P500/Nasdaq-100 は絶対に外さない。hot-refresh.yml(JP版)の構造を踏襲。
# 注意:
#   - schedule はデフォルトブランチ(main)にマージ後のみ有効 (GitHub仕様)
#   - フィーチャーブランチ検証は push トリガーで代用 (実データ検証はランナー上が初)
#   - サンドボックスからは Yahoo へ proxy403 で到達不可のため、本体の疎通確認は
#     このランナー上の実行が唯一の手段
#   - 週次のため schedule 遅延(数時間)は許容範囲。ただし遅延で場中にずれ込むと収集ジョブと
#     コミットが衝突しうる (JP版で2026-09-28に入れ替え結果が丸ごと消えた)。対策として
#     本ジョブが所有するファイルだけをコミットし、push競合は再試行、失敗は赤で通知する
#   - us-universe-refresh.yml と同じ concurrency group で直列化 (どちらも universe.csv を書くため)

on:
  schedule:
    # 月曜 11:11 UTC。NY市場寄り(夏13:30 UTC/冬14:30 UTC)より十分前。
    # :00/:15/:30 を避けオフセット。
    - cron: '11 11 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'us_hot_refresh.py'
      - '.github/workflows/us-hot-refresh.yml'

permissions:
  contents: write

# universe.csv を書く週次話題枠(本workflow)と月次更新(us-universe-refresh.yml)を同じgroupで直列化
concurrency:
  group: us-universe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 直前に走った別ジョブ(米国 月次ユニバース更新⇔週次話題枠)のpushを取り込んでから計算する。
      # checkoutはトリガー時点のコミットなので、待機中に他ジョブが更新したuniverse.csvを
      # 古いまま上書きしないよう最新へ揃える (同じconcurrency groupで直列化済み)。
      - name: Sync to latest branch head
        run: |
          git fetch -q origin "${GITHUB_REF_NAME}"
          git reset -q --hard FETCH_HEAD
          git log -1 --format='最新コミットへ同期: %h %s'

      # 依存なし (標準ライブラリのみ)
      - name: Refresh hot bucket from trending screeners
        env:
          RANK_TOP: '30'
          ABSENT_WEEKS: '4'
          KEEP_SURGE: '1.3'
          FETCH_DEADLINE_MIN: '5'
        run: python us_hot_refresh.py

      # 新規追加した話題株の履歴(日足2y/週足5y/月足max/1分足5d)を即取得する。
      # これをしないと「今週の話題枠 入れ替え」欄には出るのに、収集が回るまで
      # 資金集中ランキング/全銘柄表/チャートに出ないタイムラグが生じる (JP版と同じ対応)。
      - name: Fetch initial history for newly added stocks
        env:
          SLEEP_SEC: '0.4'
          FETCH_DEADLINE_MIN: '8'
        run: |
          NEW=$(python3 -c "import json;print(','.join(a['code'] for a in json.load(open('data/us_stocks/hot_changes_latest.json')).get('added',[])))" 2>/dev/null || true)
          if [ -z "$NEW" ]; then echo "新規追加なし・初期取得スキップ"; exit 0; fi
          echo "新規話題株の初期履歴を取得: $NEW"
          US_TICKERS="$NEW" INTERVAL=1d  RANGE=2y  python us_stock_fetch.py || true
          US_TICKERS="$NEW" INTERVAL=1wk RANGE=5y  python us_stock_fetch.py || true
          US_TICKERS="$NEW" INTERVAL=1mo RANGE=max python us_stock_fetch.py || true
          US_TICKERS="$NEW" INTERVAL=1m  RANGE=5d  python us_stock_fetch.py || true

      # (旧 "Screen money flow" ステップは削除: money_flow は収集ジョブが更新し、Pages公開時にも
      #  pages.yml が再計算するため、ここでコミットする必要が無い。衝突の原因を減らす)

      # 本ジョブの持ち物だけを1ファイルずつコミットバック:
      # universe.csv・状態/ログ/最新サマリー・新規銘柄の履歴CSV
      - name: Persist hot bucket changes
        env:
          COMMIT_BOT_NAME: us-stock-bot
        run: |
          FILES="data/us_stocks/universe.csv data/us_stocks/hot_state.json data/us_stocks/hot_changes_log.csv data/us_stocks/hot_changes_latest.json"
          NEW=$(python3 -c "import json;print(' '.join(a['code'] for a in json.load(open('data/us_stocks/hot_changes_latest.json')).get('added',[])))" 2>/dev/null || true)
          for c in $NEW; do
            for iv in 1d 1wk 1mo 1m; do FILES="$FILES data/us_stocks/${c}_${iv}.csv"; done
          done
          bash .github/scripts/commit_back.sh "chore: 米国株 話題枠 週次入れ替え+新規銘柄の初期履歴 $(date -u +'%Y-%m-%d')" $FILES
